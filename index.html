<!DOCTYPE html>
<html>
<head>
    <title>Interactive Table</title>
    <!--<link rel="stylesheet" type="text/css" href="styles_phone.css" media="screen and (max-width: 600px) and (max-height: 800px)">
    <link rel="stylesheet" type="text/css" href="styles_laptop.css" media="screen and (min-width: 601px) and (min-height: 801px)">-->
    <link rel="stylesheet" type="text/css" href="styles_phone.css?v18" media="screen and ((max-width: 940px))">
    <link rel="stylesheet" type="text/css" href="styles_laptop.css?v18" media="screen and ((min-width: 941px))">
    
</head>
<body>
    <div id="tabs">
        <button class="tab home-tab" type="button" onclick="showHomePage()" aria-label="Home" title="Home">
            <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 10.7 12 3l9 7.7v9.1a1.2 1.2 0 0 1-1.2 1.2h-5.3v-6.2h-5V21H4.2A1.2 1.2 0 0 1 3 19.8z"/>
            </svg>
        </button>
        <button class="tab" onclick="setTab(1)">Glutes</button>
        <button class="tab" onclick="setTab(2)">Legs</button>
        <button class="tab" onclick="setTab(3)">Chest</button>
        <button class="tab" onclick="setTab(4)">Back</button>
        <button class="tab" onclick="setTab(5)">Shoulders</button>
        <button class="tab" onclick="setTab(6)">Arms</button>
        <button class="tab" onclick="setTab(7)">Stomach</button>
        <button class="tab" onclick="setTab(8)">Cardio</button>
    </div>
   <div id="landingPrompt">Please select a category from the menu above to begin.</div>
   <main id="workoutContent" hidden>
   <h4 class="centered-text">
    Click the same exercise button or image again to view the next photo or video.
   </h4>
   <table class="workout-layout">
   <tr>
   <td class="exercise-panel-cell">
    <table id="GlutesTable" class="table"></table>
    <table id="LegsTable" class="table" style="display:none;"></table>
    <table id="ChestTable" class="table" style="display:none;"></table>
    <table id="BackTable" class="table" style="display:none;"></table>
    <table id="ShouldersTable" class="table" style="display:none;"></table>
    <table id="ArmsTable" class="table" style="display:none;"></table>
    <table id="StomachTable" class="table" style="display:none;"></table>
    <table id="CardioTable" class="table" style="display:none;"></table>
   </td>
   <td class="flexible-spacer-middle"></td>
   <td class="image-panel-cell">
    <div id="rightDiv">
        <div id="imageFrame"></div>
        <div id="buttonContainer">
                <table id="buttonsTable">
                    <tr>
                        <td>
                            <button id="backbtn"></button>
                        </td>
                    </tr>
                </table>
        </div>
       
    </div>
</td>
<td class="flexible-spacer"></td>
   </tr>
   </table>
   </main>
   <footer id="pageFooter">
    @TopicMapGym - contact: jjloubser@symbioses.co.za
   </footer>
    <script src="script.js?v18"></script>
</body>
</html>
